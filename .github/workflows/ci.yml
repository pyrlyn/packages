# The gate of every package: `./gradlew check` (compile, the host's tests, ktlint, detekt) as each
# package's AGENTS.md defines it, one job per Gradle build. macOS arm64 is the host every package
# targets and the one gradle/verification-metadata.xml was written on. The checkout goes to
# `packages/`, where each build looks for its sibling builds (shared-settings, pyrlyn-kit, ...).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.package }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package:
          - shared-settings
          - pyrlyn-adwaita
          - pyrlyn-fluent
          - pyrlyn-glass
          - pyrlyn-kit
          - pyrlyn-macos
          - pyrlyn-snapshot
          - pyrlyn-sync
          - pyrlyn-taskboard
          - pyrlyn-wasm
          - pyrlyn-webgl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: packages
          persist-credentials: false

      - name: Install the JDK and Conan (mise.toml)
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          working_directory: packages

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/**/build.gradle.kts') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-

      # pyrlyn-kit's conan script reads Kotlin/Native's konan.properties while Gradle creates the
      # mingwX64 task, before the Kotlin Gradle plugin downloads Kotlin/Native, so a cold
      # ~/.konan failed there. The archive comes from Maven Central, where the plugin fetches
      # it too, checked against pyrlyn-kit/gradle/verification-metadata.xml.
      - name: Fetch Kotlin/Native on a cold cache
        working-directory: packages
        run: |
          version=$(sed -n 's/.*kotlin("multiplatform") version "\(.*\)".*/\1/p' pyrlyn-kit/build.gradle.kts)
          name="kotlin-native-prebuilt-$version-macos-aarch64.tar.gz"
          dist="$HOME/.konan/kotlin-native-prebuilt-macos-aarch64-$version"
          [ -f "$dist/konan/konan.properties" ] && exit 0
          expected=$(grep -A1 "<artifact name=\"$name\">" pyrlyn-kit/gradle/verification-metadata.xml | sed -n 's/.*sha256 value="\([0-9a-f]*\)".*/\1/p')
          [ -n "$expected" ] || { echo "no checksum for $name" >&2; exit 1; }
          url="https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-native-prebuilt/$version/$name"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$name" "$url"
          echo "$expected  $RUNNER_TEMP/$name" | shasum -a 256 -c -
          mkdir -p "$HOME/.konan"
          tar -xzf "$RUNNER_TEMP/$name" -C "$HOME/.konan"
          [ -f "$dist/konan/konan.properties" ] || { echo "konan.properties is not in $dist" >&2; exit 1; }

      # shared-settings has no wrapper of its own; pyrlyn-kit's (the same Gradle version) builds it.
      - name: Check
        working-directory: packages/${{ matrix.package }}
        run: |
          if [ -x ./gradlew ]; then gradle=./gradlew; else gradle="../pyrlyn-kit/gradlew -p ."; fi
          $gradle check --console=plain
