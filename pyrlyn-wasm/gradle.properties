# Every consumer target stays declared, but no host can build them all; skip the ones it cannot instead of warning.
kotlin.native.ignoreDisabledTargets=true
# Gradle's default daemon (512 MiB heap, 384 MiB metaspace) runs out of metaspace compiling and linking every
# Kotlin/Native target in one build; the sibling packages give it the same room.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
