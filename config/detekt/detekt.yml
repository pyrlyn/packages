# Overrides on top of the shared ci-diffuser and default detekt config, the ones octo and ketch-kotlin use.
style:
  MagicNumber:
    excludes: ['**/commonTest/**', '**/nativeTest/**', '**/unixTest/**', '**/mingwTest/**', '**/jvmTest/**', '**/test/**']
    # A named property already says what its number means.
    ignorePropertyDeclaration: true

complexity:
  TooManyFunctions:
    allowedFunctionsPerClass: 25
    allowedFunctionsPerFile: 25
