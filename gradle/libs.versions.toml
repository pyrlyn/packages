# Versions shared by consumers. Consumers keep declaring the Kotlin plugin themselves (same version).
[versions]
kotlin = "2.4.21"
ktlint-gradle = "14.2.0"   # org.jlleitschuh.gradle.ktlint, approved by Ivan 2026-10-26
ktlintEngine = "1.8.0"          # ktlint engine used by the plugin

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
ktlint-gradle-plugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint-gradle" }
