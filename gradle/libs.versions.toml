# Versions shared by consumers. Consumers keep declaring the Kotlin plugin themselves (same version).
[versions]
kotlin = "2.4.21"
ktlint-gradle = "14.2.0"   # org.jlleitschuh.gradle.ktlint, approved by Ivan 2026-10-26
ktlintEngine = "1.8.0"
detekt = "2.0.0-alpha.6"   # dev.detekt; 1.23.8 is built on Kotlin 2.0.21 and cannot analyse 2.4 code, 2.0.0-alpha.6 is built on Kotlin 2.4.10          # ktlint engine used by the plugin

kotest = "6.2.6"
serializationJson = "1.12.0"
kover = "0.9.11"
s3cache = "1.9.10"

[libraries]
kover-gradle-plugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
s3cache-gradle-plugin = { module = "com.github.burrunan.s3cache:s3-build-cache", version.ref = "s3cache" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
ktlint-gradle-plugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint-gradle" }
detekt-gradle-plugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
